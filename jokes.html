<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="Случайная шутка — улыбнись с OUR STORY.">
  <title>Случайная шутка — OUR STORY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#10110f;--panel:#1a1c18;--paper:#f4f1e9;--ink:#252722;--muted:#a8aa9f;--lime:#bec9a9;--line:rgba(255,255,255,.12)}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,#292c24 0,transparent 48%),var(--bg);color:#f5f4ef;font-family:"DM Sans",Arial,sans-serif}
    .card{width:min(100%,620px);text-align:center}
    .brand{display:inline-block;margin-bottom:32px;color:#f5f4ef;font-family:"Playfair Display",Georgia,serif;font-size:.95rem;letter-spacing:.18em;text-decoration:none}
    .brand span{color:var(--lime)}
    .eyebrow{margin:0 0 12px;color:var(--lime);font-size:.68rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:clamp(2.5rem,8vw,4.6rem);font-weight:400;letter-spacing:-.04em}
    .intro{margin:12px auto 30px;color:var(--muted);font-size:.95rem;line-height:1.7}
    .joke-card{position:relative;display:grid;min-height:230px;align-content:center;gap:15px;padding:clamp(25px,6vw,48px);border:1px solid rgba(255,255,255,.22);border-radius:16px;background:linear-gradient(135deg,#f8f6ef,#e9e6dc);box-shadow:inset 0 0 0 5px rgba(255,255,255,.28),0 28px 75px rgba(0,0,0,.4);color:var(--ink);transition:transform .3s ease,opacity .3s ease}
    .joke-card.refreshing{opacity:.55;transform:translateY(4px)}
    .joke-mark{color:#8f9b7a;font-family:"Playfair Display",Georgia,serif;font-size:2rem;line-height:.7}
    .joke-text{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.15rem,4vw,1.55rem);line-height:1.65}
    .status{min-height:1.4em;margin:13px 0 0;color:#a8aa9f;font-size:.78rem}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:11px;margin-top:24px}
    button{min-height:48px;border:1px solid var(--line);border-radius:999px;padding:0 22px;background:rgba(255,255,255,.045);color:#f5f4ef;font:inherit;font-size:.85rem;cursor:pointer;transition:transform .2s ease,background .2s ease,border-color .2s ease}
    button:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(190,201,169,.55);background:rgba(190,201,169,.1)}
    button:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
    button:disabled{opacity:.6;cursor:wait}
    .primary{border-color:transparent;background:var(--lime);color:#20231c;font-weight:600}
    .primary:hover:not(:disabled){background:#ced7bd}
    .footnote{margin:27px 0 0;color:#777b70;font-size:.72rem;line-height:1.6}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="./">OUR <span>STORY</span></a>
    <p class="eyebrow">НЕБОЛЬШАЯ ПАУЗА ДЛЯ УЛЫБКИ</p>
    <h1>Случайная шутка</h1>
    <p class="intro">Нажми на кнопку — и пусть день станет чуточку веселее.</p>
    <section class="joke-card" id="jokeCard" aria-live="polite" aria-busy="false">
      <span class="joke-mark" aria-hidden="true">“</span>
      <p class="joke-text" id="jokeText">Загружаем шутку…</p>
    </section>
    <p class="status" id="status" role="status"></p>
    <div class="actions">
      <button class="primary" id="newJoke" type="button">Ещё шутку <span aria-hidden="true">↗</span></button>
      <button id="shareJoke" type="button" disabled>Скопировать</button>
    </div>
    <p class="footnote">Шутки загружаются из внешнего API icanhazdadjoke.com<br>и отображаются на английском языке.</p>
  </main>
  <script>
    (() => {
      const API_URL = "https://icanhazdadjoke.com/";
      const jokeText = document.getElementById("jokeText");
      const status = document.getElementById("status");
      const card = document.getElementById("jokeCard");
      const newButton = document.getElementById("newJoke");
      const shareButton = document.getElementById("shareJoke");
      let currentJoke = "";
      let requestController;

      async function loadJoke() {
        requestController?.abort();
        requestController = new AbortController();
        const timeout = window.setTimeout(() => requestController.abort(), 10000);
        newButton.disabled = true;
        shareButton.disabled = true;
        card.classList.add("refreshing");
        card.setAttribute("aria-busy", "true");
        status.textContent = "Ищем что-нибудь смешное…";
        try {
          const response = await fetch(API_URL, {
            headers: { Accept: "application/json" },
            signal: requestController.signal,
            cache: "no-store"
          });
          if (!response.ok) throw new Error(`API вернул ошибку ${response.status}`);
          const data = await response.json();
          if (typeof data.joke !== "string" || !data.joke.trim()) throw new Error("Пустой ответ API");
          currentJoke = data.joke.trim();
          jokeText.textContent = currentJoke;
          status.textContent = "";
          shareButton.disabled = false;
        } catch (error) {
          if (error.name === "AbortError" && requestController.signal.aborted) {
            status.textContent = "Не удалось загрузить шутку. Проверь подключение и попробуй ещё раз.";
          } else {
            status.textContent = "Сервис шуток сейчас недоступен. Попробуй ещё раз немного позже.";
          }
          if (!currentJoke) jokeText.textContent = "Похоже, шутка задерживается. Попробуем ещё раз?";
        } finally {
          window.clearTimeout(timeout);
          newButton.disabled = false;
          card.classList.remove("refreshing");
          card.setAttribute("aria-busy", "false");
        }
      }

      newButton.addEventListener("click", loadJoke);
      shareButton.addEventListener("click", async () => {
        if (!currentJoke) return;
        try {
          await navigator.clipboard.writeText(currentJoke);
          status.textContent = "Шутка скопирована!";
        } catch (error) {
          status.textContent = "Не удалось скопировать. Выдели текст шутки вручную.";
        }
      });
      loadJoke();
    })();
  </script>
</body>
</html>
