<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11131d">
  <meta name="description" content="Случайная шутка — улыбнись с OUR STORY.">
  <title>Случайная шутка — OUR STORY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="premium-theme.css">
</head>
<body class="jokes-page">
  <main class="card">
    <a class="brand" href="./" aria-label="На главную OUR STORY">OUR <span>STORY</span></a>
    <p class="eyebrow">НЕБОЛЬШАЯ ПАУЗА ДЛЯ УЛЫБКИ</p>
    <h1>Случайная шутка</h1>
    <p class="intro">Нажми на кнопку — и пусть день станет чуточку веселее.</p>
    <section class="joke-card" id="jokeCard" aria-live="polite" aria-busy="false">
      <span class="joke-mark" aria-hidden="true">“</span>
      <p class="joke-text" id="jokeText">Загружаем шутку…</p>
    </section>
    <p class="status" id="status" role="status"></p>
    <div class="actions">
      <button class="primary" id="newJoke" type="button">Ещё шутку <span aria-hidden="true">↗</span></button>
      <button id="shareJoke" type="button" disabled>Скопировать</button>
    </div>
    <p class="footnote">Шутки загружаются из внешнего API icanhazdadjoke.com<br>и отображаются на английском языке.</p>
  </main>
  <script>
    (() => {
      "use strict";
      const API_URL = "https://icanhazdadjoke.com/";
      const jokeText = document.getElementById("jokeText");
      const status = document.getElementById("status");
      const card = document.getElementById("jokeCard");
      const newButton = document.getElementById("newJoke");
      const shareButton = document.getElementById("shareJoke");
      let currentJoke = "";
      let requestController;

      async function loadJoke() {
        requestController?.abort();
        requestController = new AbortController();
        const controller = requestController;
        const timeout = window.setTimeout(() => controller.abort(), 10000);
        newButton.disabled = true;
        shareButton.disabled = true;
        card.classList.add("refreshing");
        card.setAttribute("aria-busy", "true");
        status.textContent = "Ищем что-нибудь смешное…";
        try {
          const response = await fetch(API_URL, { headers: { Accept: "application/json" }, signal: controller.signal, cache: "no-store" });
          if (!response.ok) throw new Error(`API вернул ошибку ${response.status}`);
          const data = await response.json();
          if (typeof data.joke !== "string" || !data.joke.trim()) throw new Error("Пустой ответ API");
          currentJoke = data.joke.trim();
          jokeText.textContent = currentJoke;
          status.textContent = "";
          shareButton.disabled = false;
        } catch (error) {
          if (error.name === "AbortError" && controller.signal.aborted && controller === requestController) {
            status.textContent = "Не удалось загрузить шутку. Проверь подключение и попробуй ещё раз.";
          } else if (controller === requestController) {
            status.textContent = "Сервис шуток сейчас недоступен. Попробуй ещё раз немного позже.";
          }
          if (!currentJoke && controller === requestController) jokeText.textContent = "Похоже, шутка задерживается. Попробуем ещё раз?";
        } finally {
          window.clearTimeout(timeout);
          if (controller === requestController) {
            newButton.disabled = false;
            card.classList.remove("refreshing");
            card.setAttribute("aria-busy", "false");
          }
        }
      }

      newButton.addEventListener("click", loadJoke);
      shareButton.addEventListener("click", async () => {
        if (!currentJoke) return;
        try {
          await navigator.clipboard.writeText(currentJoke);
          status.textContent = "Шутка скопирована!";
        } catch (error) {
          status.textContent = "Не удалось скопировать. Выдели текст шутки вручную.";
        }
      });
      loadJoke();
    })();
  </script>
</body>
</html>
