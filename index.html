<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="OUR STORY — наша история, бережно собранная в книгу.">
  <title>OUR STORY — наша история</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="stars" id="stars"></div><div class="ambient-glow"></div></div>

  <section class="cover" id="cover" aria-labelledby="cover-title">
    <div class="cover-content">
      <p class="cover-kicker">ОДНА ИСТОРИЯ · ДВА СЕРДЦА</p>
      <h1 id="cover-title">OUR <span>STORY</span></h1>
      <p class="cover-subtitle">История, которую хочется беречь</p>
      <button class="envelope-button" id="openEnvelope" type="button" aria-label="Нажми, чтобы открыть нашу историю">
        <span class="envelope" aria-hidden="true">
          <span class="envelope-letter"><span>наша история</span><span class="letter-heart">♥</span></span>
          <span class="envelope-back"></span><span class="envelope-flap"></span>
          <span class="envelope-front"></span><span class="envelope-seal">♡</span>
        </span>
        <span class="envelope-hint">Нажми, чтобы открыть</span>
      </button>
      <p class="cover-note">СОЗДАНО С ТЕПЛОМ И НЕЖНОСТЬЮ</p>
    </div>
  </section>

  <main class="book-stage" id="bookStage" hidden>
    <header class="book-header">
      <a class="wordmark" href="#book" aria-label="OUR STORY">OUR <span>STORY</span></a>
      <span class="edition">НАША ИСТОРИЯ · ЛИЧНОЕ ИЗДАНИЕ</span>
      <button class="music-button" id="musicToggle" type="button" aria-pressed="false" aria-label="Включить музыку"><span class="music-icon" aria-hidden="true">♫</span><span class="music-label">Музыка</span></button>
    </header>
    <section class="book" id="book" aria-label="Интерактивная книга нашей истории">
      <div class="book-spine" aria-hidden="true"></div>
      <div class="page-paper" id="pagePaper" aria-live="polite"></div>
      <div class="book-controls">
        <button class="page-button previous-button" id="previousPage" type="button" aria-label="Предыдущая страница">← <span>Назад</span></button>
        <div class="page-meta"><span class="page-number" id="pageNumber">01 / 07</span><div class="progress-track" role="progressbar" aria-label="Прогресс чтения" aria-valuemin="1" aria-valuemax="7" aria-valuenow="1"><span id="progressFill"></span></div></div>
        <button class="page-button next-button" id="nextPage" type="button" aria-label="Следующая страница"><span>Далее</span> →</button>
      </div>
      <p class="swipe-hint" aria-hidden="true">На телефоне можно листать свайпом</p>
    </section>
  </main>

  <section class="final-screen" id="finalScreen" aria-label="Финал нашей истории" hidden>
    <div class="heart-words" id="heartWords" aria-hidden="true"></div>
    <button class="reread-button" id="rereadButton" type="button">Перечитать историю</button>
  </section>

  <audio id="trackOne" src="audio/oslepitelnaya.mp3" preload="none"></audio>
  <audio id="trackTwo" src="audio/rayskie-cvety.mp3" preload="none"></audio>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
